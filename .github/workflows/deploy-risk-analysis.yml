# .github/workflows/deploy-risk-analysis.yml
#
# Posts DeploySense risk analysis as a PR comment.
# The analysis is pre-computed locally (pipeline requires VPN access to staging NerdGraph).
# In production, this would run against the public NerdGraph API.

name: DeploySense Risk Analysis

on:
  pull_request:
    types: [opened, synchronize]

permissions:
  contents: read
  pull-requests: write

jobs:
  risk-analysis:
    runs-on: ubuntu-latest
    name: Post Deployment Risk Analysis
    steps:
      - uses: actions/checkout@v4

      - name: Post PR Comment
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const analysis = fs.readFileSync('scripts/cached_analysis.md', 'utf8');

            // Truncate if needed (GH comment limit ~65K chars)
            let body_content = analysis;
            if (body_content.length > 60000) {
              body_content = body_content.substring(0, 60000) + '\n\n---\n*[Truncated — full analysis available in repo: scripts/cached_analysis.md]*';
            }

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const existing = comments.find(c => c.body.includes('<!-- deploysense-risk-analysis -->'));

            const body = '<!-- deploysense-risk-analysis -->\n## 🔍 DeploySense Risk Analysis\n\n' + body_content + '\n\n---\n*Generated by DeploySense — AI-powered deployment risk prediction*';

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body: body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: body,
              });
            }
