# .github/workflows/deploy-risk-analysis.yml
#
# Posts DeploySense risk analysis as a PR comment.
# The analysis is pre-computed locally (pipeline requires VPN access to staging NerdGraph).
# In production, this would run against the public NerdGraph API.

name: DeploySense Risk Analysis

on:
  pull_request:
    types: [opened, synchronize]

permissions:
  contents: read
  pull-requests: write

jobs:
  risk-analysis:
    runs-on: ubuntu-latest
    name: Post Deployment Risk Analysis
    steps:
      - uses: actions/checkout@v4

      - name: Post PR Comment (Part 1 only — concise summary)
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const fullAnalysis = fs.readFileSync('scripts/cached_analysis.md', 'utf8');

            // Extract Part 1 only (concise PR comment)
            let part1 = fullAnalysis;
            if (fullAnalysis.includes('PART 2:') || fullAnalysis.includes('PART 2')) {
              const splitMarker = fullAnalysis.includes('PART 2:') ? 'PART 2:' : 'PART 2';
              part1 = fullAnalysis.split(splitMarker)[0];
            }
            // Clean up Part 1 headers and separator lines
            part1 = part1.replace('PART 1: GITHUB/GITLAB PR COMMENT (CONCISE & SCANNABLE)', '');
            part1 = part1.replace('PART 1:', '');
            part1 = part1.split('\n').filter(l => !l.trim().startsWith('======')).join('\n').trim();

            // Truncate if still too long
            if (part1.length > 60000) {
              part1 = part1.substring(0, 60000) + '\n\n---\n*[Truncated]*';
            }

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const existing = comments.find(c => c.body.includes('<!-- deploysense-risk-analysis -->'));

            const dashboardUrl = 'http://localhost:8501/?account_id=${{ vars.ACCOUNT_ID }}&entity_guid=${{ vars.ENTITY_GUID }}&analysis_file=scripts/cached_analysis.md';
            const body = '<!-- deploysense-risk-analysis -->\n## 🔍 DeploySense Risk Analysis\n\n' + part1 + '\n\n---\n*Powered by DeploySense — [📊 View full analysis in dashboard](' + dashboardUrl + ')*';

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body: body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: body,
              });
            }
